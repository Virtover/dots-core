[package]
name = "dots-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Reusable game backend library for Dots with undo/redo and state persistence"

[lib]
name = "dots_core"
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[features]
default = []
python = []
javascript = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "2.0"
