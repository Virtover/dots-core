[package]
name = "dots-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Reusable game backend library for Dots with undo/redo and state persistence"
readme = "README.md"
repository = "https://github.com/Virtover/dots-core"
keywords = ["dots", "game", "game-engine", "python", "wasm", "pyo3"]
categories = ["games", "wasm", "api-bindings"]

[lib]
name = "dots_core"
crate-type = ["rlib", "cdylib"]
path = "lib.rs"

[features]
default = []
python = ["dep:pyo3"]
javascript = ["dep:wasm-bindgen"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "2.0"
js-sys = "0.3"
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
wasm-bindgen = { version = "0.2", optional = true }

[package.metadata.maturin]
features = ["python"]

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
